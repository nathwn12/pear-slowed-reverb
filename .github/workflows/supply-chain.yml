name: supply-chain

# Free-tier GitHub-hosted check on a public repository.
on:
  schedule:
    - cron: "17 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile
      # This repository is a solo fork of pear-devs/pear-desktop and does not
      # own its dependency tree: production resolves to 85 advisories inherited
      # from upstream (9 low, 36 moderate, 40 high, 0 critical). Gating on `high`
      # here can never pass without diverging from upstream, so the gate is the
      # severity that is actionable in a shipping Electron app - critical - and
      # only over production dependencies rather than the build chain.
      # Raise back to --audit-level=high if upstream's tree is ever adopted away.
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=critical
