name: reviewdog

on: [pull_request]

permissions: {}

env:
  NODE_VERSION: "24.x"

jobs:
  oxlint:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    name: runner / oxlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 11
          run_install: false

      - name: Setup NodeJS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Checkout PR source files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: src
          path: __pr_src
          persist-credentials: false

      - name: Overlay PR source
        run: |
          rm -rf src
          cp -r __pr_src/src src
          rm -rf __pr_src

      - name: Setup reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f
        with:
          reviewdog_version: latest

      - name: Run oxlint with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail

          pnpm exec oxlint src --type-aware --format=checkstyle |
            reviewdog \
              -f=checkstyle \
              -name=oxlint \
              -reporter=github-pr-review \
              -filter-mode=file \
              -fail-level=error \
              -tee
